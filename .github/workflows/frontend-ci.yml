name: Frontend CI

on:
  workflow_call:
  pull_request:
    paths:
      - 'fe-app-forkop/**'
      - 'luci-app-forkop/htdocs/luci-static/resources/view/forkop/main.js'
      - '.github/workflows/frontend-ci.yml'
  # Runs on main as well, so the yarn cache lives in the default branch's
  # scope, where pull requests and tag builds can restore it.
  push:
    branches:
      - main
    paths:
      - 'fe-app-forkop/**'
      - 'luci-app-forkop/htdocs/luci-static/resources/view/forkop/main.js'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

# A newer pull-request or branch push supersedes the running checks; main,
# tags and manual or release runs get a group of their own and always finish.
# The literal prefix keeps this group apart from the caller's when
# build.yml runs these checks as a reusable workflow.
concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main')) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe-app-forkop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      # The project has no packageManager field, so it uses the Yarn 1 the
      # hosted image ships; setup-node caches Yarn's download cache by lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: fe-app-forkop/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Check formatting
        id: format
        run: |
          yarn format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'yarn format' locally."
            exit 1
          fi

      - name: Run linter
        id: lint
        run: yarn lint --max-warnings=0

      - name: Run tests
        id: test
        run: yarn test --run

      - name: Build project
        id: build
        run: |
          yarn build
          if ! git diff --exit-code; then
            echo "::error::Build generated changes. Check build output."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          line() {
            case "$2" in
              success) mark='✅' ;;
              skipped) mark='⏭️' ;;
              *) mark='❌' ;;
            esac
            printf -- '- %s %s: %s\n' "$mark" "$1" "$2"
          }
          {
            echo "## Frontend CI Results"
            echo ""
            line "Format check" "$FORMAT"
            line "Lint check" "$LINT"
            line "Tests" "$TESTS"
            line "Build" "$BUILD"
          } >>"$GITHUB_STEP_SUMMARY"
