name: Backend CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prokop/files/**'
      - 'prokop/Makefile'
      - 'build.sh'
      - 'install.sh'
      - 'ops/hosting/**'
      - 'ops/mirror/**'
      - 'ops/pages/**'
      - 'tests/**'
      - 'luci-app-prokop/**'
      - 'fe-app-prokop/**'
      - '.github/**'
  push:
    branches:
      - main
    paths:
      - 'prokop/files/**'
      - 'prokop/Makefile'
      - 'build.sh'
      - 'install.sh'
      - 'ops/hosting/**'
      - 'ops/mirror/**'
      - 'ops/pages/**'
      - 'tests/**'
      - 'luci-app-prokop/**'
      - 'fe-app-prokop/**'
      - '.github/**'

permissions:
  contents: read

# A newer pull-request or branch push supersedes the running checks; main,
# tags and manual or release runs get a group of their own and always finish.
# The literal prefix keeps this group apart from the caller's when
# build.yml runs these checks as a reusable workflow.
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main')) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  ucode:
    name: ucode syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up ucode
        uses: ./.github/actions/setup-ucode
        with:
          save-cache: 'true'

      - name: Check ucode syntax
        shell: bash
        run: |
          find prokop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -c -o /dev/null
          find prokop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -S -c -o /dev/null

  tests:
    # Shards are split by expected duration (.github/scripts); the matrix
    # length is the shard count, so growing it needs no other change.
    name: Backend tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Set up ucode
        uses: ./.github/actions/setup-ucode

      # Several tests evaluate LuCI views in node and need its navigator global (Node >= 21).
      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Run backend tests
        shell: bash
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          node --version
          mapfile -t tests < <(python3 .github/scripts/backend_test_shards.py plan \
            --total "$SHARD_TOTAL" --index "$SHARD_INDEX")
          (( ${#tests[@]} > 0 )) || { echo "::error::Shard $SHARD_INDEX has no tests"; exit 1; }
          results_dir="$RUNNER_TEMP/backend-test-results"
          results="$results_dir/shard-$((SHARD_INDEX + 1))-of-$SHARD_TOTAL.tsv"
          mkdir -p "$results_dir"
          : >"$results"
          failed=0
          for test_file in "${tests[@]}"; do
            started="$EPOCHREALTIME"
            if output="$(bash "$test_file" 2>&1)"; then
              status=pass
            else
              status=fail
            fi
            seconds="$(awk -v a="$started" -v b="$EPOCHREALTIME" 'BEGIN { printf "%.1f", b - a }')"
            printf '%s\t%s\t%s\n' "$test_file" "$status" "$seconds" >>"$results"
            if [[ "$status" == pass ]]; then
              echo "::group::PASS $test_file (${seconds}s)"
              printf '%s\n' "$output"
              echo "::endgroup::"
              continue
            fi
            printf 'FAIL %s (%ss)\n' "$test_file" "$seconds"
            printf '%s\n' "$output"
            # Job logs need repository access; annotations and the run summary
            # do not. Carry the failure reason into both.
            reason="$(printf '%s' "$output" | tail -n 20 | tr '\r\n' '  ' | sed 's/%/%25/g')"
            echo "::error file=$test_file::Backend regression failed: ${reason}"
            {
              printf '### %s\n\n```\n' "$test_file"
              printf '%s\n' "$output" | tail -n 40
              printf '```\n'
            } >>"$GITHUB_STEP_SUMMARY"
            failed=1
          done
          exit "$failed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The one check branch rules need: it passes only when the syntax check and
  # every shard passed and the shards together ran each tests/*.sh once.
  backend-checks:
    name: Backend Runtime Checks
    if: always()
    needs:
      - ucode
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          sparse-checkout: |
            .github/scripts
            tests

      - name: Download test results
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: backend-test-results-*
          path: ${{ runner.temp }}/backend-test-results
          merge-multiple: true

      - name: Verify every test ran once and passed
        if: always()
        shell: bash
        run: python3 .github/scripts/backend_test_shards.py verify "$RUNNER_TEMP/backend-test-results"

      - name: Require the syntax check and all shards
        if: always()
        shell: bash
        env:
          UCODE_RESULT: ${{ needs.ucode.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'ucode syntax: %s\nbackend tests: %s\n' "$UCODE_RESULT" "$TESTS_RESULT"
          [[ "$UCODE_RESULT" == success && "$TESTS_RESULT" == success ]]
